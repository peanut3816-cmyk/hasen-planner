<style>
*{box-sizing:border-box}
:root{--teal:#2b2b2b;--teal-soft:#ecebe8;--mint:#2b2b2b;--mint-light:#ecebe8;--pink:#ef4444;--ink:#1e1c1a;--muted:#6b6560;--paper:#f6f4f1;--line:#e3ded8}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f6f4f1;min-height:100vh;color:var(--ink);-webkit-tap-highlight-color:transparent;padding-bottom:96px;font-size:16px}
.wrap{max-width:480px;margin:0 auto;position:relative;z-index:1}
header{display:flex;justify-content:center;align-items:center;padding:22px 20px 4px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px}
.spark{display:none}
.mascot{display:none}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(30,28,26,.08);margin:12px 16px;border:1px solid #e3ded8}
.pbar{height:6px;background:#e3ded8;border-radius:999px;overflow:hidden;margin-top:10px}
.pfill{height:100%;width:0;background:var(--mint);border-radius:999px;transition:width .35s}
.daterow{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 16px 0}
.daterow h2{font-size:16px;margin:0;font-weight:600;min-width:170px;text-align:center}
.navbtn{width:36px;height:36px;border-radius:8px;border:1px solid #e3ded8;background:#fff;font-size:15px;color:var(--muted);font-weight:600;cursor:pointer;flex:none}
.todaypill[hidden]{display:none}
.todaypill{display:block;margin:8px auto 0;border:1px solid #e3ded8;background:#fff;color:var(--mint);font:inherit;font-size:12px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
.catrow{display:flex;flex-direction:column;gap:8px;margin:12px 16px 0;align-items:flex-start}
.catmenu{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #e3ded8;border-radius:10px;padding:10px;box-shadow:0 1px 3px rgba(30,28,26,.08)}
.caret{font-size:10px;color:var(--muted)}
.chip{border:1px solid #e3ded8;background:#fff;border-radius:8px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.chip .cd{width:10px;height:10px;border-radius:999px;flex:none}
.chip.on{color:var(--ink);border-color:var(--mint);background:var(--mint-light)}
.addrow{display:flex;gap:8px;margin:12px 16px}
.addrow input[type=text]{flex:1;min-width:0;border:1px solid #e3ded8;border-radius:8px;padding:12px 14px;font:inherit;background:#fff;color:var(--ink)}
.addrow input:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px rgba(43,43,43,.12)}
.addrow input[type=time]{border:1px solid #e3ded8;border-radius:8px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink);width:112px}
.btn{border:none;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--mint);flex:none}
.btn:active{transform:scale(.98)}
.btn.pink{background:var(--mint)}
#list,#events,#glist{margin:0 16px;display:flex;flex-direction:column;gap:8px}
.todo,.eventrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e3ded8;border-radius:10px;padding:10px 12px;box-shadow:0 1px 2px rgba(30,28,26,.04)}
.todo.done,.eventrow.done{background:#fbfaf8;border-color:#e3ded8}
.todo.done .txt,.eventrow.done .txt{color:var(--muted)}
.check{position:relative;width:24px;height:24px;border-radius:6px;border:1.5px solid #d8d2ca;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.todo.done .check,.eventrow.done .check{background:var(--mint);border-color:var(--mint)}
.check::before{content:'';position:absolute;inset:-9px}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;color:#fff;flex:none}
.txt{flex:1;font-weight:500;word-break:break-word}
.del{border:none;background:none;color:#9d968e;font-size:17px;padding:4px 6px;cursor:pointer;flex:none}
.edit{border:1px solid #e3ded8;background:#fff;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer;flex:none}
.small{margin:10px 16px;color:var(--muted);background:none;border:none;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.empty{text-align:center;color:#9d968e;padding:24px 10px;font-weight:500}
.empty b{display:none}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:12px 16px 2px}
.calhead h2{font-size:17px;margin:0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 16px}
.dow{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.day{position:relative;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:500;background:#fff;border:1px solid #e3ded8;cursor:pointer}
.day.blank{background:none;border:none;cursor:default}
.day.today{border-color:var(--mint)}
.day.sel{background:var(--mint);color:#fff;border-color:var(--mint)}
.day .dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:999px;background:var(--mint)}
.day.sel .dot{background:#fff}
#monthbox[hidden]{display:none}
.datebtn{font:inherit;font-size:16px;font-weight:600;min-width:170px;text-align:center;background:none;border:none;color:var(--ink);cursor:pointer;padding:8px 4px}
.daylabel{margin:14px 16px 4px;font-weight:600}
.etime{background:#ecebe8;color:var(--mint);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;flex:none;white-space:nowrap}
.etime.notime{background:#f6f4f1;color:var(--muted)}
.addrow2{display:flex;gap:8px;margin:0 16px 12px;align-items:center}
.addrow2 input[type=time]{border:1px solid #e3ded8;border-radius:8px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink);width:104px;flex:none}
.dash{color:#9d968e;font-weight:600}
.edcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.edcol input[type=text],.edcol select{border:1px solid #e3ded8;border-radius:8px;padding:8px 12px;font:inherit;background:#fff;color:var(--ink);min-width:0}
.todo.editing,.eventrow.editing{border-color:var(--mint)}
.edtimes{display:flex;gap:6px;align-items:center}
.edtimes input[type=time]{border:1px solid #e3ded8;border-radius:8px;padding:6px 8px;font:inherit;background:#fff;color:var(--ink);width:96px;flex:none}
.btn.tiny{padding:8px 12px;font-size:13px}
.eventrow .txt,.todo .txt{cursor:pointer}
.pri{width:9px;height:9px;border-radius:999px;flex:none}
.mv{border:none;background:none;color:#9d968e;font-size:12px;padding:2px 5px;cursor:pointer;flex:none;line-height:1}
.mvcol{display:flex;flex-direction:column;gap:2px;flex:none}
.edtimes select{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:5;background:linear-gradient(to top,#f6f4f1 60%,rgba(246,244,241,0))}
.tabbar{display:flex;background:#fff;border:1px solid #e3ded8;border-radius:12px;box-shadow:0 2px 8px rgba(30,28,26,.1);padding:4px}
.tabbar button{border:none;background:none;font:inherit;font-weight:600;padding:10px 14px;border-radius:9px;color:var(--muted);cursor:pointer}
.tabbar button.on{background:var(--mint);color:#fff}
section[hidden]{display:none}
#undotoast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;gap:10px;white-space:nowrap}
#undotoast button{border:none;background:none;color:#d4d0ca;font:inherit;font-weight:600;cursor:pointer;padding:2px 4px}

.addrow2[hidden]{display:none}
.timelink[hidden]{display:none}
.addopts{display:flex;align-items:center;gap:12px;margin:0 16px 12px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:none;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--teal-soft);color:var(--teal)}
.timelink{border:none;background:none;color:var(--teal);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 2px;text-decoration:underline}
.donesec{margin:0}
.donesec summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:6px 2px;display:flex;gap:6px;align-items:center;user-select:none}
.donesec summary::-webkit-details-marker{display:none}
.donesec .dcaret{font-size:10px;transition:transform .15s}
.donesec[open] .dcaret{transform:rotate(180deg)}
.donesec .donerows{display:flex;flex-direction:column;gap:8px;padding:2px 0 4px}
.edtimes input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:#fff;color:var(--ink);flex:1;min-width:0}
.bkbtn{position:absolute;top:20px;right:16px;border:1px solid #e3ded8;background:#fff;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:2}
#bkpanel .bktitle{font-weight:700;margin-bottom:4px}
#bkpanel p{color:var(--muted);font-size:13px;margin:0 0 10px}
#bkpanel .bkrow{display:flex;gap:8px;flex-wrap:wrap}
#bkconfirm{margin-top:10px;font-size:13px;background:#fbfaf8;border:1px solid #e3ded8;border-radius:8px;padding:10px}
#bkconfirm .bkrow{margin-top:8px}
#bkstatus{font-size:12px;color:var(--muted);margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Hasen's Planner</h1>
  <button class="bkbtn" id="bktoggle" aria-expanded="false">Backup</button>
</header>
<div class="card" id="bkpanel" hidden>
  <div class="bktitle">Your data</div>
  <p>Entries are saved in this browser on this device. Export a backup file to keep a copy you can restore later. A safety copy is also kept inside the app.</p>
  <div class="bkrow">
    <button class="btn tiny" id="bkexport">Export backup</button>
    <button class="edit" id="bkimport" style="padding:8px 12px">Restore backup</button>
  </div>
  <input type="file" id="bkfile" accept="application/json,.json" hidden>
  <div id="bkconfirm" hidden></div>
  <p id="bkstatus"></p>
</div>

<section id="view-todos">
  <div class="daterow">
    <button class="navbtn" id="dprev">‹</button>
    <h2 id="todolabel"></h2>
    <button class="navbtn" id="dnext">›</button>
  </div>
  <button class="todaypill" id="gotoday" hidden>Back to today</button>
  <div class="card">
    <div id="ptext" style="font-weight:700"></div>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
  </div>
  <div class="catrow" id="catrow"></div>
  <div class="addrow">
    <input type="text" id="tinput" placeholder="Add a task" autocomplete="off">
    <button class="btn" id="tadd">+</button>
  </div>
  <div id="list"></div>
  <button class="small" id="cleardone" hidden>Clear finished tasks</button>
</section>

<section id="view-cal" hidden>
  <div class="daterow">
    <button class="navbtn" id="cprev" aria-label="Previous day">‹</button>
    <button class="datebtn" id="cdatebtn" aria-expanded="false"><span id="clabel"></span> <span class="caret" id="ccaret">▾</span></button>
    <button class="navbtn" id="cnext" aria-label="Next day">›</button>
  </div>
  <button class="todaypill" id="gotodaycal" hidden>Back to today</button>
  <div id="monthbox" hidden>
    <div class="calhead">
      <button class="navbtn" id="mprev" aria-label="Previous month">‹</button>
      <h2 id="mlabel"></h2>
      <button class="navbtn" id="mnext" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="events"></div>
  <div class="addrow" style="margin-bottom:8px">
    <input type="text" id="einput" placeholder="Add to this day" autocomplete="off">
    <button class="btn" id="eadd">+</button>
  </div>
  <div class="addopts">
    <div class="seg" id="kindseg">
      <button type="button" data-kind="task" class="on">Task</button>
      <button type="button" data-kind="ev">Event</button>
    </div>
    <button type="button" class="timelink" id="timetoggle" hidden>Add time</button>
  </div>
  <div class="addrow2" id="timerow" hidden>
    <input type="time" id="etimeinput">
    <span class="dash">–</span>
    <input type="time" id="eend">
  </div>
</section>

<section id="view-groc" hidden>
  <div class="addrow" style="margin-top:14px">
    <input type="text" id="ginput" placeholder="Add an item" autocomplete="off">
    <button class="btn" id="gadd">+</button>
  </div>
  <div id="glist"></div>
  <button class="small" id="clearcheck" hidden>Clear checked items</button>
</section>
</div>

<nav><div class="tabbar">
  <button id="tab-todos" class="on">To-dos</button>
  <button id="tab-cal">Calendar</button>
  <button id="tab-groc">Groceries</button>
</div></nav>

<script>
var $=function(s){return document.querySelector(s)};
var KEY_T='hasen_planner_todos',KEY_E='hasen_planner_events',KEY_G='hasen_planner_groceries';
var CATS={work:{label:'Work',color:'#4a4744',bg:'#ecebe8'},biz:{label:'Business',color:'#4a4744',bg:'#ecebe8'},per:{label:'Personal',color:'#4a4744',bg:'#ecebe8'},exe:{label:'Exercise',color:'#4a4744',bg:'#ecebe8'},stu:{label:'Study',color:'#4a4744',bg:'#ecebe8'},cho:{label:'Chores',color:'#4a4744',bg:'#ecebe8'}};
var PRIS={hi:{label:'High',color:'#dc2626'},md:{label:'Normal',color:'#9d968e'},lo:{label:'Low',color:'#d8d2ca'}};
var todos=[],events=[],gitems=[];
var KEY_SNAP='hasen_planner_snapshot';
function readKey(k){var raw=null;try{raw=localStorage.getItem(k)}catch(e){return{a:[],bad:false,missing:true}}if(raw==null)return{a:[],bad:false,missing:true};try{var v=JSON.parse(raw);return{a:Array.isArray(v)?v:[],bad:!Array.isArray(v),missing:false}}catch(e){return{a:[],bad:true,missing:false}}}
function snapData(){try{var _s=JSON.parse(localStorage.getItem(KEY_SNAP)||'null');if(_s&&Array.isArray(_s.todos)&&Array.isArray(_s.events)&&Array.isArray(_s.groceries))return _s}catch(e){}return null}
var _rt=readKey(KEY_T),_re=readKey(KEY_E),_rg=readKey(KEY_G);
todos=_rt.a;events=_re.a;gitems=_rg.a;
var recovered=false;
var _snap=snapData();
if(_snap){
  if((_rt.bad||_rt.missing)&&_snap.todos.length){todos=_snap.todos;recovered=true}
  if((_re.bad||_re.missing)&&_snap.events.length){events=_snap.events;recovered=true}
  if((_rg.bad||_rg.missing)&&_snap.groceries.length){gitems=_snap.groceries;recovered=true}
}
var storageBroken=false;
function noteMsg(msg){var _n=document.createElement('div');_n.textContent=msg;_n.style.cssText='position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.18);max-width:90vw;text-align:center';document.body.appendChild(_n);setTimeout(function(){_n.remove()},4500)}
function persistAll(){
  try{
    localStorage.setItem(KEY_SNAP,JSON.stringify({t:Date.now(),todos:todos,events:events,groceries:gitems}));
    localStorage.setItem(KEY_T,JSON.stringify(todos));
    localStorage.setItem(KEY_E,JSON.stringify(events));
    localStorage.setItem(KEY_G,JSON.stringify(gitems));
    storageBroken=false;
  }catch(e){if(!storageBroken){storageBroken=true;noteMsg("Couldn't save. Browser storage may be full - export a backup using the Backup button.")}}
}
function save(){persistAll()}
function saveG(){persistAll()}
if(recovered){persistAll();setTimeout(function(){noteMsg('Recovered your entries from the in-app safety copy')},700)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function pad(n){return String(n).padStart(2,'0')}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayFromKey(k){var p=k.split('-');return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10))}
var today=new Date();
var sel=keyOf(today);
var curCat='per';
var editId=null;
var editTid=null;
var editGid=null;
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOWS=['S','M','T','W','T','F','S'];
var WDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var i,t;
for(i=0;i<todos.length;i++){t=todos[i];
  if(!t.date)   t.date=keyOf(today);
  if(!CATS[t.cat]) t.cat='per';
  if(!PRIS[t.pri]) t.pri='md';
}
var undoTimer=null;
function hideUndoToast(){if(undoTimer){clearTimeout(undoTimer);undoTimer=null}var d=document.getElementById('undotoast');if(d)d.remove()}
function showUndo(msg,onUndo){
  hideUndoToast();
  var d=document.createElement('div'); d.id='undotoast';
  d.innerHTML='<span>'+esc(msg)+'</span><button type="button">Undo</button>';
  d.querySelector('button').addEventListener('click',function(){hideUndoToast();onUndo()});
  document.body.appendChild(d);
  undoTimer=setTimeout(hideUndoToast,5000);
}
function deleteTodo(id){
  var k;
  for(k=0;k<todos.length;k++){
    if(todos[k].id===id){
      var idx=k,item=todos[k];
      todos.splice(k,1); save();
      showUndo('Task deleted',function(){
        todos.splice(Math.min(idx,todos.length),0,item); save(); renderTodos(); renderCal();
      });
      return;
    }
  }
}
function deleteGrocery(id){
  var k;
  for(k=0;k<gitems.length;k++){
    if(gitems[k].id===id){
      var idx=k,item=gitems[k];
      gitems.splice(k,1); saveG(); renderGrocery();
      showUndo('Item deleted',function(){
        gitems.splice(Math.min(idx,gitems.length),0,item); saveG(); renderGrocery();
      });
      return;
    }
  }
}
var KEY_L='hasen_planner_lastday',tk=keyOf(today),moved=0;
try{
  var lastday=localStorage.getItem(KEY_L);
  if(lastday&&lastday<tk){
    for(i=0;i<todos.length;i++){t=todos[i];
      if(!t.done&&(t.cat==='work'||t.cat==='biz')&&t.date<tk){t.date=tk;moved++}
    }
    if(moved)save();
  }
  localStorage.setItem(KEY_L,tk);
}catch(e){}
if(moved){var _ts=document.createElement('div');_ts.textContent='Moved '+moved+' unfinished task'+(moved===1?'':'s')+' to today';_ts.style.cssText='position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.18)';document.body.appendChild(_ts);setTimeout(function(){_ts.remove()},3500)}

function fmtLabel(k){var d=dayFromKey(k);return WDAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}

var catOpen=false;
function renderChips(){
  var cur=CATS[curCat],k;
  var html='<button class="chip on" data-act="catmenu"><span class="cd" style="background:'+cur.color+'"></span>'+'Category: '+cur.label+' <span class="caret">'+(catOpen?'\u25b4':'\u25be')+'</span></button>';
  if(catOpen){
    html+='<div class="catmenu">';
    for(k in CATS){
      html+='<button class="chip'+(curCat===k?' on':'')+'" data-cat="'+k+'"><span class="cd" style="background:'+CATS[k].color+'"></span>'+CATS[k].label+'</button>';
    }
    html+='</div>';
  }
  $('#catrow').innerHTML=html;
}
function renderProgress(){
  var rows=todos.filter(function(x){return x.date===sel});
  var n=rows.length,done=rows.filter(function(x){return x.done}).length;
  $('#ptext').textContent=n?(done+' of '+n+' done'):'No tasks yet';
  $('#pfill').style.width=n?Math.round(100*done/n)+'%':'0%';
}
function priOptions(p){
  var h='';
  for(var k in PRIS){h+='<option value="'+k+'"'+(p===k?' selected':'')+'>'+PRIS[k].label+'</option>'}
  return h;
}
function moveTodo(id,dir,date){
  var ai=-1,k;
  for(k=0;k<todos.length;k++)if(todos[k].id===id){ai=k;break}
  if(ai<0)return;
  var same=[];
  for(k=0;k<todos.length;k++)if(todos[k].date===date)same.push(k);
  var pos=same.indexOf(ai); if(pos<0)return;
  var q=dir==='up'?pos-1:pos+1; if(q<0||q>=same.length)return;
  var tmp=todos[ai];todos[ai]=todos[same[q]];todos[same[q]]=tmp;
  save();
}
function catOptions(cat){
  var h='';
  for(var k in CATS){h+='<option value="'+k+'"'+(cat===k?' selected':'')+'>'+CATS[k].label+'</option>'}
  return h;
}
function taskEditRow(t){
  return '<div class="todo editing" data-id="'+t.id+'">'+
    '<div class="check" data-act="toggle">'+(t.done?'\u2713':'')+'</div>'+
    '<div class="edcol"><input type="text" class="eetext" value="'+esc(t.text)+'">'+
    '<div class="edtimes"><select class="eecat">'+catOptions(t.cat)+'</select><select class="eepri">'+priOptions(t.pri)+'</select></div></div>'+
    '<div class="mvcol"><button class="mv" data-act="up">▲</button><button class="mv" data-act="dn">▼</button></div>'+
    '<button class="btn tiny" data-act="save">✓</button><button class="del" data-act="cancel">↩</button>'+
    '</div>';
}
var doneOpenT=false,doneOpenG=false,doneOpenC=false;
function bindDoneSec(el,which){
  var ds=el.querySelector('.donesec'); if(!ds)return;
  ds.addEventListener('toggle',function(){
    if(which==='t')doneOpenT=ds.open;else if(which==='g')doneOpenG=ds.open;else doneOpenC=ds.open;
  });
}
function taskRow(t){
  return '<div class="todo'+(t.done?' done':'')+'" data-id="'+t.id+'">'+
    '<div class="check" data-act="toggle">'+(t.done?'\u2713':'')+'</div>'+
    '<span class="pri" style="background:'+PRIS[t.pri].color+'"></span>'+
    '<span class="tag" style="background:'+CATS[t.cat].bg+';color:'+CATS[t.cat].color+'">'+CATS[t.cat].label+'</span>'+
    '<div class="txt">'+esc(t.text)+'</div>'+
    '<button class="edit" data-act="edit">Edit</button><button class="del" data-act="del">✕</button></div>';
}
function renderTodos(){
  $('#todolabel').textContent=fmtLabel(sel);
  $('#gotoday').hidden=(sel===keyOf(today));
  var el=$('#list'),html='',doneHtml='',rows=todos.filter(function(x){return x.date===sel}),nd=0;
  for(i=0;i<rows.length;i++){t=rows[i];
    var row=(t.id===editTid)?taskEditRow(t):taskRow(t);
    if(t.done){doneHtml+=row;nd++}else html+=row;
  }
  if(doneHtml)html+='<details class="donesec"'+(doneOpenT?' open':'')+'><summary><span class="dcaret">▾</span>Completed ('+nd+')</summary><div class="donerows">'+doneHtml+'</div></details>';
  el.innerHTML=html||'<div class="empty">No tasks for this day</div>';
  bindDoneSec(el,'t');
  $('#cleardone').hidden=!rows.some(function(x){return x.done});
  renderProgress();
}
function renderDay(){
  var el=$('#events'),html='',doneHtml='',k,e,r,nd=0;
  var evs=events.filter(function(x){return x.date===sel});
  evs.sort(function(a,b){var x=a.time||'99:99',y=b.time||'99:99';return x<y?-1:x>y?1:0});
  for(k=0;k<evs.length;k++){e=evs[k];
    var tt=e.time?(e.end?(e.time+'-'+e.end):e.time):'';
    if(e.id===editId){
      html+='<div class="eventrow editing" data-id="'+e.id+'" data-kind="ev">'+
        '<div class="edcol"><input type="text" class="eetext" value="'+esc(e.text)+'">'+
        '<div class="edtimes"><input type="date" class="eedate" value="'+esc(e.date)+'"></div>'+
        '<div class="edtimes"><input type="time" class="eestart" value="'+esc(e.time||'')+'"><span class="dash">–</span><input type="time" class="eeend" value="'+esc(e.end||'')+'"></div></div>'+
        '<button class="btn tiny" data-act="save">✓</button><button class="del" data-act="cancel">↩</button><button class="del" data-act="del">✕</button></div>';
    } else {
      html+='<div class="eventrow" data-id="'+e.id+'" data-kind="ev"><span class="etime'+(e.time?'':' notime')+'">'+(e.time?esc(tt):'All day')+'</span><div class="txt">'+esc(e.text)+'</div><button class="edit" data-act="edit">Edit</button><button class="del" data-act="del">✕</button></div>';
    }
  }
  var tks=todos.filter(function(x){return x.date===sel});
  for(k=0;k<tks.length;k++){r=tks[k];
    var row;
    if(r.id===editTid){
      row=taskEditRow(r).replace('class="todo editing"','class="eventrow editing" data-kind="tsk"');
    } else {
      row='<div class="eventrow'+(r.done?' done':'')+'" data-id="'+r.id+'" data-kind="tsk"><div class="check" data-act="toggle">'+(r.done?'\u2713':'')+'</div><span class="pri" style="background:'+PRIS[r.pri].color+'"></span><span class="tag" style="background:'+CATS[r.cat].bg+';color:'+CATS[r.cat].color+'">'+CATS[r.cat].label+'</span><div class="txt">'+esc(r.text)+'</div><button class="edit" data-act="edit">Edit</button><button class="del" data-act="del">✕</button></div>';
    }
    if(r.done){doneHtml+=row;nd++}else html+=row;
  }
  if(doneHtml)html+='<details class="donesec"'+(doneOpenC?' open':'')+'><summary><span class="dcaret">▾</span>Completed ('+nd+')</summary><div class="donerows">'+doneHtml+'</div></details>';
  el.innerHTML=html||'<div class="empty">Nothing planned</div>';
  bindDoneSec(el,'c');
}
var calOpen=false;
function renderCal(){
  var sd=dayFromKey(sel),cy=sd.getFullYear(),cm=sd.getMonth();
  $('#mlabel').textContent=MONTHS[cm]+' '+cy;
  var first=new Date(cy,cm,1).getDay();
  var days=new Date(cy,cm+1,0).getDate();
  var html='',d,k,cls;
  for(i=0;i<7;i++)html+='<div class="dow">'+DOWS[i]+'</div>';
  for(i=0;i<first;i++)html+='<div class="day blank"></div>';
  for(d=1;d<=days;d++){
    k=cy+'-'+pad(cm+1)+'-'+pad(d);
    cls='day';
    if(k===keyOf(today))cls+=' today';
    if(k===sel)cls+=' sel';
    if(events.some(function(e){return e.date===k})||todos.some(function(x){return x.date===k}))cls+=' hasdot';
    html+='<div class="'+cls+'" data-key="'+k+'">'+d+(cls.indexOf('hasdot')>-1?'<span class="dot"></span>':'')+'</div>';
  }
  $('#grid').innerHTML=html;
  $('#clabel').textContent=fmtLabel(sel);
  $('#monthbox').hidden=!calOpen;
  $('#ccaret').textContent=calOpen?'\u25b4':'\u25be';
  $('#cdatebtn').setAttribute('aria-expanded',calOpen?'true':'false');
  $('#gotodaycal').hidden=(sel===keyOf(today));
  renderDay();
}
function renderAll(){renderTodos();renderCal();renderGrocery()}

function addTodo(){
  var v=$('#tinput').value.trim(); if(!v)return;
  todos.push({id:Date.now()+''+Math.floor(Math.random()*999),text:v,done:false,date:sel,cat:curCat,pri:'md'});
  $('#tinput').value=''; save(); renderTodos();
}
var calKind='task';
function addCalItem(){
  var v=$('#einput').value.trim(); if(!v)return;
  if(calKind==='task'){
    todos.push({id:Date.now()+''+Math.floor(Math.random()*999),text:v,done:false,date:sel,cat:curCat,pri:'md'});
  } else {
    events.push({id:Date.now()+''+Math.floor(Math.random()*999),date:sel,text:v,time:$('#etimeinput').value||'',end:$('#eend').value||''});
  }
  $('#einput').value=''; $('#etimeinput').value=''; $('#eend').value='';
  $('#timerow').hidden=true; $('#timetoggle').textContent='Add time';
  save(); renderAll();
}
$('#tadd').addEventListener('click',addTodo);
$('#tinput').addEventListener('keydown',function(e){if(e.key==='Enter')addTodo()});
$('#eadd').addEventListener('click',addCalItem);
$('#einput').addEventListener('keydown',function(e){if(e.key==='Enter')addCalItem()});
$('#kindseg').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  calKind=b.getAttribute('data-kind');
  var bs=$('#kindseg').querySelectorAll('button'),q;
  for(q=0;q<bs.length;q++)bs[q].className=(bs[q]===b?'on':'');
  $('#timetoggle').hidden=(calKind!=='ev');
  if(calKind!=='ev'){$('#timerow').hidden=true;$('#timetoggle').textContent='Add time'}
});
$('#timetoggle').addEventListener('click',function(){
  var tr=$('#timerow'); tr.hidden=!tr.hidden;
  this.textContent=tr.hidden?'Add time':'No time';
});
$('#catrow').addEventListener('click',function(e){
  if(e.target.closest('[data-act=catmenu]')){catOpen=!catOpen;renderChips();return}
  var c=e.target.closest('.chip'); if(!c)return;
  curCat=c.getAttribute('data-cat'); catOpen=false; renderChips();
});
$('#list').addEventListener('click',function(e){
  var row=e.target.closest('.todo'); if(!row)return;
  var id=row.getAttribute('data-id');
  if(e.target.closest('[data-act=toggle]')){
    for(i=0;i<todos.length;i++)if(todos[i].id===id)todos[i].done=!todos[i].done;
    save(); renderTodos();
  } else if(e.target.closest('[data-act=save]')){
    var txt=row.querySelector('.eetext').value.trim(); if(!txt)return;
    var nc=row.querySelector('.eecat').value;
    for(i=0;i<todos.length;i++)if(todos[i].id===id){todos[i].text=txt;todos[i].cat=nc;todos[i].pri=row.querySelector('.eepri').value||'md'}
    editTid=null; save(); renderTodos();
  } else if(e.target.closest('[data-act=cancel]')){
    editTid=null; renderTodos();
  } else if(e.target.closest('[data-act=del]')){
    editTid=null; deleteTodo(id); renderTodos();
  } else if(e.target.closest('[data-act=up]')||e.target.closest('[data-act=dn]')){
    moveTodo(id,e.target.closest('[data-act=up]')?'up':'dn',sel); renderTodos();
  } else if(e.target.closest('[data-act=edit]')){
    editTid=id; renderTodos();
  } else if(e.target.closest('.txt')){
    editTid=id; renderTodos();
  }
});
$('#cleardone').addEventListener('click',function(){
  todos=todos.filter(function(x){return !(x.date===sel&&x.done)});save();renderTodos()});
$('#events').addEventListener('click',function(e){
  var row=e.target.closest('.eventrow'); if(!row)return;
  var id=row.getAttribute('data-id'),kind=row.getAttribute('data-kind');
  if(e.target.closest('[data-act=save]')){
    var txt=row.querySelector('.eetext').value.trim(); if(!txt)return;
    if(kind==='ev'){
      var nd=row.querySelector('.eedate').value;
      for(i=0;i<events.length;i++)if(events[i].id===id){events[i].text=txt;events[i].time=row.querySelector('.eestart').value||'';events[i].end=row.querySelector('.eeend').value||'';if(nd)events[i].date=nd}
      editId=null;
    } else {
      var nc=row.querySelector('.eecat').value;
      for(i=0;i<todos.length;i++)if(todos[i].id===id){todos[i].text=txt;todos[i].cat=nc;todos[i].pri=row.querySelector('.eepri').value||'md'}
      editTid=null;
    }
    save(); renderCal();
  } else if(e.target.closest('[data-act=cancel]')){
    if(kind==='tsk')editTid=null; else editId=null;
    renderCal();
  } else if(e.target.closest('[data-act=toggle]')&&kind==='tsk'){
    for(i=0;i<todos.length;i++)if(todos[i].id===id)todos[i].done=!todos[i].done;
    save(); renderCal();
  } else if(e.target.closest('[data-act=del]')){
    editId=null; editTid=null;
    if(kind==='ev'){events=events.filter(function(x){return x.id!==id});save()}
    else{deleteTodo(id)}
    renderCal();
  } else if(e.target.closest('[data-act=edit]')){
    if(kind==='tsk')editTid=id; else editId=id;
    renderCal();
  } else if(kind==='ev'){
    editId=id; renderCal();
  } else if(kind==='tsk'&&(e.target.closest('[data-act=up]')||e.target.closest('[data-act=dn]'))){
    moveTodo(id,e.target.closest('[data-act=up]')?'up':'dn',sel); renderCal();
  } else if(kind==='tsk'&&e.target.closest('.txt')){
    editTid=id; renderCal();
  }
});
$('#events').addEventListener('keydown',function(e){
  var row=e.target.closest('.eventrow'); if(!row)return;
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('eetext')){
    var b=row.querySelector('[data-act=save]'); if(b)b.click();
  }
});
$('#grid').addEventListener('click',function(e){
  var c=e.target.closest('.day'); if(!c||!c.getAttribute('data-key'))return;
  sel=c.getAttribute('data-key'); editId=null; editTid=null; calOpen=false; renderAll();
});
function shiftMonth(n){
  var d=dayFromKey(sel),day=d.getDate();
  d.setDate(1); d.setMonth(d.getMonth()+n);
  var dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(day,dim));
  sel=keyOf(d); editId=null; editTid=null; renderAll();
}
$('#cdatebtn').addEventListener('click',function(){calOpen=!calOpen;renderCal()});
$('#cprev').addEventListener('click',function(){var d=dayFromKey(sel);d.setDate(d.getDate()-1);sel=keyOf(d);editId=null;editTid=null;renderAll()});
$('#cnext').addEventListener('click',function(){var d=dayFromKey(sel);d.setDate(d.getDate()+1);sel=keyOf(d);editId=null;editTid=null;renderAll()});
$('#mprev').addEventListener('click',function(){shiftMonth(-1)});
$('#mnext').addEventListener('click',function(){shiftMonth(1)});
$('#dprev').addEventListener('click',function(){var d=dayFromKey(sel);d.setDate(d.getDate()-1);sel=keyOf(d);renderAll()});
$('#dnext').addEventListener('click',function(){var d=dayFromKey(sel);d.setDate(d.getDate()+1);sel=keyOf(d);renderAll()});
$('#gotoday').addEventListener('click',function(){sel=keyOf(today);renderAll()});
$('#gotodaycal').addEventListener('click',function(){sel=keyOf(today);editId=null;editTid=null;calOpen=false;renderAll()});
function renderGrocery(){
  var el=$('#glist'),html='',doneHtml='',j,g,nd=0;
  for(j=0;j<gitems.length;j++){g=gitems[j];
    var row;
    if(g.id===editGid){
      row='<div class="todo editing" data-id="'+g.id+'"><div class="edcol"><input type="text" class="eetext" value="'+esc(g.text)+'"></div><button class="btn tiny" data-act="save">\u2713</button><button class="del" data-act="cancel">\u21a9</button></div>';
    } else {
      row='<div class="todo'+(g.done?' done':'')+'" data-id="'+g.id+'">'+
        '<div class="check" data-act="toggle">'+(g.done?'\u2713':'')+'</div>'+
        '<div class="txt">'+esc(g.text)+'</div>'+
        '<button class="edit" data-act="edit">Edit</button><button class="del" data-act="del">✕</button></div>';
    }
    if(g.done){doneHtml+=row;nd++}else html+=row;
  }
  if(doneHtml)html+='<details class="donesec"'+(doneOpenG?' open':'')+'><summary><span class="dcaret">▾</span>Picked up ('+nd+')</summary><div class="donerows">'+doneHtml+'</div></details>';
  el.innerHTML=html||'<div class="empty">Nothing on the list</div>';
  bindDoneSec(el,'g');
  $('#clearcheck').hidden=!nd;
}
function addGrocery(){
  var v=$('#ginput').value.trim(); if(!v)return;
  gitems.push({id:Date.now()+''+Math.floor(Math.random()*999),text:v,done:false});
  $('#ginput').value=''; saveG(); renderGrocery();
}
$('#gadd').addEventListener('click',addGrocery);
$('#ginput').addEventListener('keydown',function(e){if(e.key==='Enter')addGrocery()});
$('#glist').addEventListener('keydown',function(e){
  var row=e.target.closest('.todo'); if(!row)return;
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('eetext')){
    var b=row.querySelector('[data-act=save]'); if(b)b.click();
  }
});
$('#glist').addEventListener('click',function(e){
  var row=e.target.closest('.todo'); if(!row)return;
  var id=row.getAttribute('data-id'),j;
  if(e.target.closest('[data-act=save]')){
    var v=row.querySelector('.eetext').value.trim(); if(!v)return;
    for(j=0;j<gitems.length;j++)if(gitems[j].id===id)gitems[j].text=v;
    editGid=null; saveG(); renderGrocery();
  } else if(e.target.closest('[data-act=cancel]')){
    editGid=null; renderGrocery();
  } else if(e.target.closest('[data-act=toggle]')){
    for(j=0;j<gitems.length;j++)if(gitems[j].id===id)gitems[j].done=!gitems[j].done;
    saveG(); renderGrocery();
  } else if(e.target.closest('[data-act=del]')){
    editGid=null; deleteGrocery(id);
  } else if(e.target.closest('[data-act=edit]')){
    editGid=id; renderGrocery();
  } else if(e.target.closest('.txt')){
    editGid=id; renderGrocery();
  }
});
$('#clearcheck').addEventListener('click',function(){
  var removed=[],j;
  for(j=0;j<gitems.length;j++)if(gitems[j].done)removed.push({i:j,item:gitems[j]});
  if(!removed.length)return;
  gitems=gitems.filter(function(x){return !x.done}); saveG(); renderGrocery();
  showUndo(removed.length===1?'1 item cleared':removed.length+' items cleared',function(){
    for(var k=removed.length-1;k>=0;k--)gitems.splice(Math.min(removed[k].i,gitems.length),0,removed[k].item);
    saveG(); renderGrocery();
  });
});
/* Backup and restore */
var bkpanel=$('#bkpanel'),bktoggle=$('#bktoggle');
function fmtWhen(t){try{return new Date(t).toLocaleString('en-NZ',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}catch(e){return ''}}
function renderBkStatus(){
  var m='';
  try{var _s=JSON.parse(localStorage.getItem(KEY_SNAP)||'null');if(_s&&_s.t)m='In-app safety copy from '+fmtWhen(_s.t)+'.'}catch(e){}
  $('#bkstatus').textContent=m;
}
bktoggle.addEventListener('click',function(){bkpanel.hidden=!bkpanel.hidden;bktoggle.setAttribute('aria-expanded',String(!bkpanel.hidden));if(!bkpanel.hidden)renderBkStatus()});
function cleanTodo(x){
  if(!x||typeof x.text!=='string')return null;
  var d=(typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date))?x.date:keyOf(new Date());
  return{id:String(x.id||Date.now()+''+Math.floor(Math.random()*999)),text:x.text.slice(0,500),done:!!x.done,date:d,cat:CATS[x.cat]?x.cat:'per',pri:PRIS[x.pri]?x.pri:'md'};
}
function cleanEvent(x){
  if(!x||typeof x.text!=='string')return null;
  var d=(typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date))?x.date:keyOf(new Date());
  return{id:String(x.id||Date.now()+''+Math.floor(Math.random()*999)),date:d,text:x.text.slice(0,500),time:typeof x.time==='string'?x.time:'',end:typeof x.end==='string'?x.end:''};
}
function cleanGroc(x){
  if(!x||typeof x.text!=='string')return null;
  return{id:String(x.id||Date.now()+''+Math.floor(Math.random()*999)),text:x.text.slice(0,500),done:!!x.done};
}
function cleanList(arr,fn){var out=[],k;if(!Array.isArray(arr))return out;for(k=0;k<arr.length;k++){var v=fn(arr[k]);if(v)out.push(v)}return out}
$('#bkexport').addEventListener('click',function(){
  var data={app:'hasen-planner',version:1,exportedAt:new Date().toISOString(),todos:todos,events:events,groceries:gitems};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='planner-backup-'+keyOf(new Date())+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
  $('#bkstatus').textContent='Backup file downloaded. Keep it somewhere safe, like the Files app.';
});
var pendingRestore=null;
$('#bkimport').addEventListener('click',function(){$('#bkfile').click()});
$('#bkfile').addEventListener('change',function(){
  var f=this.files&&this.files[0];this.value='';
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var box=$('#bkconfirm');
    try{
      var data=JSON.parse(r.result);
      if(!data||(!Array.isArray(data.todos)&&!Array.isArray(data.events)&&!Array.isArray(data.groceries)))throw new Error('bad');
      var ct=cleanList(data.todos,cleanTodo),ce=cleanList(data.events,cleanEvent),cg=cleanList(data.groceries,cleanGroc);
      pendingRestore={todos:ct,events:ce,groceries:cg};
      var when=data.exportedAt?(' from '+fmtWhen(data.exportedAt)):'';
      box.innerHTML='This backup'+when+' has <b>'+ct.length+'</b> task'+(ct.length===1?'':'s')+', <b>'+ce.length+'</b> event'+(ce.length===1?'':'s')+' and <b>'+cg.length+'</b> grocery item'+(cg.length===1?'':'s')+'. Restoring replaces what is currently in the planner.<div class="bkrow"><button class="btn tiny" id="bkyes">Restore</button><button class="edit" id="bkno" style="padding:8px 12px">Cancel</button></div>';
      box.hidden=false;
      $('#bkyes').addEventListener('click',doRestore);
      $('#bkno').addEventListener('click',function(){box.hidden=true;pendingRestore=null});
    }catch(e){
      box.textContent="That file doesn't look like a planner backup.";
      box.hidden=false;
    }
  };
  r.readAsText(f);
});
function doRestore(){
  var box=$('#bkconfirm');box.hidden=true;
  if(!pendingRestore)return;
  var prev={todos:todos,events:events,groceries:gitems};
  todos=pendingRestore.todos;events=pendingRestore.events;gitems=pendingRestore.groceries;
  pendingRestore=null;
  editId=null;editTid=null;editGid=null;
  persistAll();
  renderAll();renderChips();renderProgress();
  showUndo('Backup restored',function(){
    todos=prev.todos;events=prev.events;gitems=prev.groceries;
    persistAll();renderAll();renderChips();renderProgress();
  });
  renderBkStatus();
}
function switchTab(t){
  calOpen=false;
  $('#view-todos').hidden=(t!=='todos');
  $('#view-cal').hidden=(t!=='cal');
  $('#view-groc').hidden=(t!=='groc');
  $('#tab-todos').className=(t==='todos'?'on':'');
  $('#tab-cal').className=(t==='cal'?'on':'');
  $('#tab-groc').className=(t==='groc'?'on':'');
  renderAll();
}
$('#tab-todos').addEventListener('click',function(){switchTab('todos')});
$('#tab-cal').addEventListener('click',function(){switchTab('cal')});
$('#tab-groc').addEventListener('click',function(){switchTab('groc')});
renderChips();
renderAll();
</script>
</body>
</html>
